<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coastal page transition demo</title>
<style>
:root{--red:#dc2626;--s950:#0a0a0a;--s900:#1a1a1a;--s800:#2a2a2a;--disp:'Arial Black','Arial Bold',Gadget,sans-serif;--body:Arial,Helvetica,sans-serif}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--s950);color:#fff;font-family:var(--disp);overflow:hidden}a{color:inherit;text-decoration:none}button{font:inherit}.r{color:var(--red)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:900;pointer-events:none}
.nav{position:relative;z-index:10;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#000}.brand{display:flex;align-items:center;gap:12px}.brand img{width:50px;height:50px;object-fit:contain}.brand b{font-size:18px;font-weight:400;letter-spacing:1px;line-height:1.1}.brand small{display:block;margin-top:3px;color:#9ca3af;font:700 9px var(--body);letter-spacing:2px}
.links{display:flex;gap:28px;font-size:13px;text-transform:uppercase}.links button{position:relative;border:0;background:none;color:#fff;padding:8px 0;cursor:pointer;text-transform:uppercase}.links button:after{content:"";position:absolute;left:0;right:0;bottom:1px;height:3px;background:var(--red);transform:scaleX(0);transition:transform .25s}.links button:hover,.links button[aria-current=page]{color:var(--red)}.links button[aria-current=page]:after{transform:scaleX(1)}
#page{height:calc(100% - 72px);display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,.85fr);background:var(--s950)}
.head{position:relative;display:flex;align-items:center;justify-content:center;padding:28px 24px 42px;overflow:hidden;text-align:center}.head img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.head:after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,rgb(220 38 38/.18),transparent 50%),rgb(0 0 0/.62)}.copy{position:relative;z-index:1;max-width:980px}h1{font-size:clamp(34px,6vw,76px);line-height:1.05;letter-spacing:2px;font-weight:400;text-transform:uppercase}.copy p{margin-top:14px;color:#d1d5db;font:400 clamp(16px,2vw,20px) var(--body)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px 24px 82px;min-height:0}.card{position:relative;overflow:hidden;background:var(--s900);border:1px solid var(--s800);min-height:0}.card img{width:100%;height:100%;object-fit:cover;display:block}.card span{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(transparent,rgb(0 0 0/.9));font-size:14px;letter-spacing:1px;text-transform:uppercase}
.switch{position:fixed;left:50%;bottom:14px;z-index:1000;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:5px;background:#fff;box-shadow:0 10px 32px rgb(0 0 0/.55);font:700 13px var(--body);white-space:nowrap}.switch button{border:0;padding:10px 13px;background:transparent;color:#111;cursor:pointer}.switch button[aria-pressed=true]{background:var(--red);color:#fff}.switch #slow{border-left:1px solid #ddd}.switch #slow[aria-pressed=true]{background:#111}.switch button:focus-visible,.links button:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media(max-width:760px){.nav{height:60px;padding:0 12px}.brand img{width:38px;height:38px}.brand b{font-size:13px}.links{display:none}#page{height:calc(100% - 60px);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.cards{grid-template-columns:1fr;gap:8px;padding:10px 12px 74px}.card:nth-child(n+3){display:none}.switch{left:6px;right:6px;transform:none;justify-content:space-between}.switch button{padding:9px 5px;font-size:11px}}
.switch #scope{border-left:1px solid #ddd}.switch #scope[aria-pressed=true]{background:#111;color:#fff}
@media(max-width:1060px){.switch{width:min(720px,calc(100vw - 12px));flex-wrap:wrap;justify-content:center;white-space:normal}.cards{padding-bottom:118px}}
@media(max-width:760px){.switch{left:6px;right:6px;width:auto;transform:none;display:grid;grid-template-columns:repeat(2,1fr)}.switch #scope,.switch #slow{border-left:0}.switch button{padding:8px 4px}.cards{padding-bottom:190px}}
</style>
</head>
<body>
<header class="nav"><div class="brand"><img src="../../../public/images/logo-320.webp" alt=""><b><span class="r">COASTAL</span> CONSTRUCTION<small>SERVICES OF LOUISIANA</small></b></div><nav class="links" id="links" aria-label="Demo pages"></nav></header>
<main id="page"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="switch" role="group" aria-label="Choose page transition">
  <button data-fx="jaws">Jaws (default)</button><button data-fx="strata">A Red strata</button><button data-fx="dump">B Dump load</button><button data-fx="blade">C Dozer blade</button><button data-fx="split">D Ground split</button><button id="scope" aria-pressed="false">Dirt: all pages</button><button id="slow" aria-pressed="false">Slow-mo</button>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const pages=[
 {label:'Home',h:'Building <span class="r">Stronger</span> Foundations',p:'Expert dirt construction services across the area of Acadiana',img:'hero-dirt-work-1600',cards:[['Site Pads','site-pad-construction'],['Pond Construction','pond-construction'],['Culvert Installation','culvert-installation']]},
 {label:'Services',h:'Our <span class="r">Services</span>',p:'Expert dirt work solutions tailored to your project needs',img:'land-leveling-card-800',cards:[['Land Leveling','land-leveling'],['Material Delivery','material-delivery'],['Levee Creation','levee-construction']]},
 {label:'About',h:'About <span class="r">Us</span>',p:'The people and passion behind Coastal Construction Services',img:'pasture-clearing-card-800',cards:[['Pasture Clearing','pasture-clearing'],['Bushhogging','bushhogging'],['Demolition','demolition']]},
 {label:'Contact',h:'Get In <span class="r">Touch</span>',p:"Let's discuss your project and bring your vision to life",img:'pond-construction-card-800',cards:[['Site Pads','site-pad-construction'],['Land Leveling','land-leveling'],['Demolition','demolition']]}
];
let pageIndex=0,selected='jaws',slow=false,running=false;
function renderPage(i){pageIndex=i;const d=pages[i];$('#page').innerHTML=`<section class="head"><img src="../../../public/images/${d.img}.webp" alt=""><div class="copy"><h1>${d.h}</h1><p>${d.p}</p></div></section><section class="cards">${d.cards.map(([n,p])=>`<div class="card"><img src="../../../public/images/${p}-card-800.webp" alt=""><span>${n}</span></div>`).join('')}</section>`;$$('#links button').forEach((b,n)=>n===i?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))}
$('#links').innerHTML=pages.map(p=>`<button>${p.label}</button>`).join('');$$('#links button').forEach((b,i)=>b.onclick=()=>go(i));

/* canvas helpers */
const fx=$('#fx'),g=fx.getContext('2d');let W=0,H=0,D=1;
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;fx.width=Math.ceil(W*D);fx.height=Math.ceil(H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
const clamp=(n,a=0,b=1)=>Math.min(b,Math.max(a,n)),easeIn=t=>t*t*t,easeOut=t=>1-Math.pow(1-t,3),easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clear=()=>{g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,fx.width,fx.height);g.setTransform(D,0,0,D,0,0)};

/* 1. Excavator jaws: two toothed plates that interlock on one shared profile. */
function toothProfile(P,T,m){const a=[];for(let k=-1;k*P<W+P;k++){const o=k*P;a.push([o,m-T/2],[o+.2*P,m+T/2],[o+.5*P,m+T/2],[o+.7*P,m-T/2])}return a}
function drawJaw(pts,P,T,m,dy,isTop){g.save();g.translate(0,dy);g.beginPath();if(isTop){g.moveTo(-30,-90);g.lineTo(W+30,-90);for(let i=pts.length-1;i>=0;i--)g.lineTo(pts[i][0],pts[i][1])}else{g.moveTo(-30,H+90);g.lineTo(W+30,H+90);for(let i=pts.length-1;i>=0;i--)g.lineTo(pts[i][0],pts[i][1])}g.closePath();g.fillStyle='#dc2626';g.fill();g.save();g.clip();const dir=isTop?-1:1,root=m+dir*T/2;g.fillStyle='#991b1b';g.fillRect(-30,isTop?root-11:root+1,W+60,10);g.fillStyle='#000';g.fillRect(-30,isTop?root-25:root+15,W+60,7);g.fillStyle='#fff';g.fillRect(-30,isTop?root-34:root+31,W+60,2);g.fillStyle='#000';const off=isTop?.35:.85;for(let k=-1;k*P<W+P;k++){g.beginPath();g.arc(k*P+off*P,root+dir*48,Math.max(3,P*.055),0,Math.PI*2);g.fill()}g.restore();g.lineWidth=3;g.strokeStyle='#000';g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();g.restore()}
const jaws={close:340,hold:130,open:430,draw(ms){const m=H/2,P=clamp(W/14,48,104),T=P*.68,pts=toothProfile(P,T,m);let k;if(ms<this.close)k=easeIn(ms/this.close);else if(ms<this.close+this.hold)k=1;else k=1-easeIO((ms-this.close-this.hold)/this.open);const gap=(1-k)*(H/2+T+50),s=ms-this.close,shake=s>=0&&s<210?8*Math.exp(-s/48)*Math.cos(s/8.5):0;drawJaw(pts,P,T,m,-gap+shake,true);drawJaw(pts,P,T,m,gap+shake,false)}};

/* 2. Dirt clearing: brown soil layers pile in, then drop away shedding clods. */
const browns=['#6b4a2f','#533821','#3d2817','#2a1b10'],rests=[-.1,.25,.53,.79];
function soilY(i,x){const a=Math.min(H*.04,30),q=Math.round(x/12)*12;return a*Math.sin(q*.006+i*1.7)+a*.55*Math.sin(q*.019+i*2.3)+a*.28*Math.sin(q*.057+i)}
let clods=[];function makeClods(){const n=Math.round(clamp(W/8,60,170));let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;clods=Array.from({length:n},()=>{const layer=Math.floor(rnd()*4);return {layer,x:rnd()*W,delay:rnd()*330+layer*70,vx:(rnd()-.5)*240,vy:-120-rnd()*280,r:2+rnd()*rnd()*12,rot:rnd()*6,spin:(rnd()-.5)*12,c:browns[Math.floor(rnd()*3)]}})}
const dirt={close:410,hold:90,open:760,layerY(i,ms){const rest=rests[i]*H,bottom=H+70;let k;if(ms<this.close)k=easeOut(clamp((ms-i*55)/(this.close-165)));else if(ms<this.close+this.hold)k=1;else k=1-easeIn(clamp((ms-this.close-this.hold-i*85)/(this.open-300)));return rest+(bottom-rest)*(1-k)},draw(ms){if(!clods.length)makeClods();for(let i=0;i<4;i++){const y=this.layerY(i,ms);g.beginPath();g.moveTo(-10,H+90);for(let x=-10;x<=W+12;x+=12)g.lineTo(x,y+soilY(i,x));g.lineTo(W+10,H+90);g.closePath();g.fillStyle=browns[i];g.fill();g.strokeStyle='rgb(255 255 255/.08)';g.lineWidth=1;g.beginPath();for(let x=-10;x<=W+12;x+=12){const yy=y+soilY(i,x);x===-10?g.moveTo(x,yy):g.lineTo(x,yy)}g.stroke()}const o=ms-this.close-this.hold;if(o>0){const fade=clamp((this.open-o)/130);for(const c of clods){const s=(o-c.delay)/1000;if(s<0)continue;const y0=this.layerY(c.layer,this.close+this.hold+c.delay)+soilY(c.layer,c.x),px=c.x+c.vx*s,py=y0+c.vy*s+1500*s*s;if(py>H+30)continue;g.save();g.globalAlpha=fade;g.translate(px,py);g.rotate(c.rot+c.spin*s);g.fillStyle=c.c;g.beginPath();g.moveTo(c.r,0);g.lineTo(c.r*.4,c.r*.9);g.lineTo(-c.r*.8,c.r*.55);g.lineTo(-c.r,-c.r*.35);g.lineTo(c.r*.2,-c.r*.95);g.closePath();g.fill();g.restore()}}}};

/* 3. Radial shutter: two blades spin around a pivot, trailing black and white arcs. */
const spin={close:440,hold:60,open:480,draw(ms){const cx=W/2,cy=H/2,R=Math.hypot(W,H)/2+24,base=-Math.PI/4;let lead=base,tail=base,edge,trail,energy,dir=-1;if(ms<this.close){const t=ms/this.close;lead=base+Math.PI*easeIO(t);edge=lead;energy=Math.sin(Math.PI*t);trail=-1}else if(ms<this.close+this.hold){lead=base+Math.PI;edge=lead;energy=0;trail=-1}else{const t=(ms-this.close-this.hold)/this.open;lead=base+Math.PI;tail=base+Math.PI*easeIO(t);edge=tail;energy=Math.sin(Math.PI*t);trail=-1}
 if(lead-tail>=Math.PI-.0001){g.fillStyle='#dc2626';g.fillRect(-2,-2,W+4,H+4)}else for(const s of [0,Math.PI]){g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,tail+s,lead+s);g.closePath();g.fillStyle='#dc2626';g.fill()}
 const span=1.05*energy;for(const s of [0,Math.PI]){[[.17,'#000',8],[.29,'#fff',2],[.42,'#000',13],[.57,'#fff',3],[.72,'#000',6],[.88,'#fff',2],[1,'#000',16]].forEach(([r,c,w],i)=>{if(span<=.02)return;const len=span*(.55+.45*((i*37)%10)/10),a=edge+s;g.beginPath();g.arc(cx,cy,r*R,a+trail*len,a);g.strokeStyle=c;g.lineWidth=w;g.lineCap='butt';g.stroke()});
  const line=(ang,w,c)=>{g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R);g.strokeStyle=c;g.lineWidth=w;g.stroke()};if(ms<this.close+this.hold+this.open){line(edge+s+trail*.018,12,'#000');line(edge+s+trail*.048,2.5,'#fff')}}
 const p=clamp(ms/110)*clamp((this.close+this.hold+this.open-ms)/110),hub=clamp(W*.03,16,32)*p;if(hub>.5){g.beginPath();g.arc(cx,cy,hub,0,Math.PI*2);g.fillStyle='#000';g.fill();g.beginPath();g.arc(cx,cy,hub*.62,0,Math.PI*2);g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.beginPath();g.arc(cx,cy,hub*.25,0,Math.PI*2);g.fillStyle='#dc2626';g.fill()}}};

/* Dirt variations */
const soilFill=()=>{g.fillStyle=browns[0];g.fillRect(-80,-80,W+160,H+160);for(let i=1;i<4;i++){const y=rests[i]*H;g.beginPath();g.moveTo(-80,H+80);for(let x=-80;x<=W+92;x+=12)g.lineTo(x,y+soilY(i,x));g.lineTo(W+80,H+80);g.closePath();g.fillStyle=browns[i];g.fill()}};
const impact=(s,amp=7)=>s>=0&&s<200?amp*Math.exp(-s/42)*Math.cos(s/7.5):0;
function clod(c,px,py,s,color,alpha){if(py>H+30||px<-30||px>W+30)return;g.save();g.globalAlpha=alpha;g.translate(px,py);g.rotate(c.rot+c.spin*s);g.fillStyle=color||c.c;g.beginPath();g.moveTo(c.r,0);g.lineTo(c.r*.4,c.r*.9);g.lineTo(-c.r*.8,c.r*.55);g.lineTo(-c.r,-c.r*.35);g.lineTo(c.r*.2,-c.r*.95);g.closePath();g.fill();g.restore()}

const strataColors=['#dc2626','#7f1d1d','#2a1210','#0a0a0a'];
const strata={close:300,hold:70,open:470,y(i,ms){const rest=rests[i]*H-(i?0:44),b=H+70;let k;if(ms<this.close)k=easeOut(clamp((ms-(3-i)*38)/(this.close-114)));else if(ms<this.close+this.hold)k=1;else k=1-easeIn(clamp((ms-this.close-this.hold-i*55)/(this.open-165)));return rest+(b-rest)*(1-k)},draw(ms){const shake=impact(ms-this.close);g.save();g.translate(0,shake);for(let i=0;i<4;i++){const y=this.y(i,ms),edge=dy=>{g.beginPath();for(let x=-20;x<=W+24;x+=12){const yy=y+soilY(i,x)+dy;x===-20?g.moveTo(x,yy):g.lineTo(x,yy)}};edge(0);g.lineTo(W+20,H+100);g.lineTo(-20,H+100);g.closePath();g.fillStyle=strataColors[i];g.fill();edge(1);g.strokeStyle='#000';g.lineWidth=4;g.stroke();edge(6);g.strokeStyle='rgb(255 255 255/.72)';g.lineWidth=1.2;g.stroke()}g.restore();const o=ms-this.close-this.hold;if(o>0){const fade=clamp((this.open-o)/110);for(const c of clods){const s=(o-c.delay*.55)/1000;if(s<0)continue;const y0=this.y(c.layer,this.close+this.hold+c.delay*.55)+soilY(c.layer,c.x);clod(c,c.x+c.vx*s,y0+c.vy*s+1700*s*s,s,strataColors[c.layer%3],fade)}}}};

const dump={close:300,hold:60,open:530,edge(x){const q=Math.round(x/16)*16,a=Math.min(H*.075,58);return a*Math.sin(q*.009+1)+a*.55*Math.sin(q*.023+2)+a*.25*Math.sin(q*.071)},draw(ms){const shake=impact(ms-this.close,10);g.save();g.translate(0,shake);if(ms<this.close+this.hold){const t=clamp(ms/this.close),y=easeIn(t)*(H*1.15+90)-90,line=()=>{for(let x=-20;x<=W+24;x+=12)g.lineTo(x,y+this.edge(x))};g.save();g.beginPath();g.moveTo(-20,-100);g.lineTo(W+20,-100);for(let x=W+24;x>=-20;x-=12)g.lineTo(x,y+this.edge(x));g.closePath();g.clip();soilFill();g.restore();g.beginPath();line();g.strokeStyle='#dc2626';g.lineWidth=7;g.stroke();g.beginPath();for(let x=-20;x<=W+24;x+=12){const yy=y+this.edge(x)-8;x===-20?g.moveTo(x,yy):g.lineTo(x,yy)}g.strokeStyle='#000';g.lineWidth=3;g.stroke()}else{const t=clamp((ms-this.close-this.hold)/this.open),y=easeIn(t)*(H+170)-60;g.save();g.beginPath();g.moveTo(-20,H+100);g.lineTo(W+20,H+100);for(let x=W+24;x>=-20;x-=12)g.lineTo(x,y+this.edge(x));g.closePath();g.clip();soilFill();g.restore();g.beginPath();for(let x=-20;x<=W+24;x+=12){const yy=y+this.edge(x);x===-20?g.moveTo(x,yy):g.lineTo(x,yy)}g.strokeStyle='#dc2626';g.lineWidth=7;g.stroke()}g.restore();const o=ms-this.close;if(o>0){const fade=clamp((this.close+this.hold+this.open-ms)/120);for(const c of clods){const s=(o-c.delay*.25)/1000;if(s<0)continue;clod(c,c.x+c.vx*1.5*s,H+8+(c.vy*2.25-280)*s+1800*s*s,s,c.layer===0?'#dc2626':c.c,fade)}}}};

const blade={close:190,hold:40,open:560,pos(t){const m=H*.14+80;return -m+(W+2*m)*easeIO(t)},bx(b,y){return b+(y-H/2)*.14},draw(ms){if(ms<this.close+this.hold){const k=easeOut(clamp(ms/this.close)),y=(1-k)*(H+150);g.save();g.translate(0,y+impact(ms-this.close,5));soilFill();g.restore();return}const t=clamp((ms-this.close-this.hold)/this.open),b=this.pos(t);g.save();g.beginPath();g.moveTo(this.bx(b,-30),-30);g.lineTo(W+80,-30);g.lineTo(W+80,H+30);g.lineTo(this.bx(b,H+30),H+30);g.closePath();g.clip();soilFill();g.fillStyle='rgb(0 0 0/.3)';g.beginPath();g.moveTo(this.bx(b,-30),-30);g.lineTo(this.bx(b+64,-30),-30);g.lineTo(this.bx(b+64,H+30),H+30);g.lineTo(this.bx(b,H+30),H+30);g.closePath();g.fill();g.restore();const quad=(a,w,c)=>{g.beginPath();g.moveTo(this.bx(b+a,-30),-30);g.lineTo(this.bx(b+a+w,-30),-30);g.lineTo(this.bx(b+a+w,H+30),H+30);g.lineTo(this.bx(b+a,H+30),H+30);g.closePath();g.fillStyle=c;g.fill()};quad(-34,34,'#dc2626');quad(-43,9,'#7f1d1d');quad(-5,6,'#000');quad(-28,2,'#fff');g.fillStyle='#000';for(let y=20;y<H;y+=clamp(H/9,62,92)){g.beginPath();g.arc(this.bx(b-18,y),y,4,0,Math.PI*2);g.fill()}const o=ms-this.close-this.hold,fade=clamp((this.open-o)/90);for(const c of clods){const d=c.delay/430*this.open*.84,s=(o-d)/1000;if(s<0)continue;const b0=this.pos(clamp(d/this.open)),y=c.x/W*H;clod(c,this.bx(b0-48,y)-Math.abs(c.vx)*.8*s,y+c.vy*.55*s+1450*s*s,s,c.layer===0?'#dc2626':c.c,fade)}}};

const split={close:220,hold:150,open:470,crack(y){const q=Math.round(y/26)*26,a=Math.min(W*.08,62);return W/2+a*Math.sin(q*.011+1)+a*.5*Math.sin(q*.031+2)+((q/26)%2?a*.22:-a*.22)},half(side,dx){g.save();g.translate(side*dx,0);g.rotate(side*.035*clamp(dx/(W*.6)));g.beginPath();const edge=side<0?-140:W+140;g.moveTo(edge,-120);for(let y=-120;y<=H+130;y+=26)g.lineTo(this.crack(y),y);g.lineTo(edge,H+130);g.closePath();g.save();g.clip();soilFill();g.restore();g.strokeStyle='#dc2626';g.lineWidth=5;g.beginPath();for(let y=-120;y<=H+130;y+=26){const x=this.crack(y);y===-120?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();g.restore()},draw(ms){if(ms<this.close){const y=(1-easeOut(ms/this.close))*(H+160);g.save();g.translate(0,y);soilFill();g.restore();return}if(ms<this.close+this.hold){g.save();g.translate(0,impact(ms-this.close,6));soilFill();const t=clamp((ms-this.close)/110);g.beginPath();for(let y=-120;y<=(H+130)*t;y+=26){const x=this.crack(y);y===-120?g.moveTo(x,y):g.lineTo(x,y)}g.strokeStyle='#dc2626';g.lineWidth=7;g.stroke();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();g.restore();return}const t=clamp((ms-this.close-this.hold)/this.open),dx=easeIn(t)*(W*.72+170);this.half(-1,dx);this.half(1,dx);const fade=clamp((1-t)/.22);for(const c of clods){const s=(ms-this.close-this.hold-c.delay*.45)/1000;if(s<0)continue;const y=c.x/W*H,x=this.crack(y),side=c.layer%2?1:-1;clod(c,x+side*(90+Math.abs(c.vx)*1.6)*s,y+c.vy*.25*s+1250*s*s,s,c.layer===0?'#dc2626':c.c,fade)}}};

const effects={jaws,dirt,spin,strata,dump,blade,split};
let scopeContact=false,lastDirt='blade';
const routeFx=next=>scopeContact?(next===3?lastDirt:'jaws'):selected;
function total(e){return e.close+e.hold+e.open}
function go(next,forced){if(running||next===pageIndex)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){renderPage(next);return}running=true;size();makeClods();const e=effects[forced||routeFx(next)],rate=slow?3.2:1,start=performance.now();let swapped=false;(function frame(now){const ms=(now-start)/rate;clear();if(ms>=total(e)){running=false;clear();if(!swapped)renderPage(next);return}e.draw(ms);if(!swapped&&ms>=e.close+e.hold*.45){swapped=true;renderPage(next)}requestAnimationFrame(frame)})(start)}
function nextPage(){return (pageIndex+1)%pages.length}
function setFx(name){selected=name;if(name!=='jaws')lastDirt=name;$$('[data-fx]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fx===name))}
$$('[data-fx]').forEach(b=>b.onclick=()=>{if(running)return;const name=b.dataset.fx;setFx(name);const target=scopeContact&&name!=='jaws'&&pageIndex!==3?3:nextPage();go(target,name)});$('#scope').onclick=e=>{scopeContact=!scopeContact;e.currentTarget.setAttribute('aria-pressed',scopeContact);e.currentTarget.textContent=scopeContact?'Dirt: Contact only':'Dirt: all pages'};$('#slow').onclick=e=>{slow=!slow;e.currentTarget.setAttribute('aria-pressed',slow)};
window.__seek=(name,ms)=>{size();makeClods();clear();effects[name].draw(ms)};window.__clear=clear;window.__timing=()=>Object.fromEntries(Object.entries(effects).map(([k,e])=>[k,total(e)]));
renderPage(0);setFx('blade');
</script>
